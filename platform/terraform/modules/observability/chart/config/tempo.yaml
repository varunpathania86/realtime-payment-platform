server:
  http_listen_port: 3200
usage_report:
  reporting_enabled: false
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: "0.0.0.0:4318"}
storage:
  trace:
    backend: local
    local: {path: /data/blocks}
    wal: {path: /data/wal}
compactor:
  compaction:
    block_retention: 24h
ingester:
  trace_idle_period: 5s
  max_block_duration: 1m
