{{- if .Values.backends }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
stringData:
  password: {{ required "grafanaPassword is required" .Values.grafanaPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
data:
{{- range $path, $_ := .Files.Glob "config/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
{{- $specs := list
  (dict "name" "prometheus" "port" 9090 "nodePort" 30090 "ready" "/-/ready" "args" (list "--config.file=/etc/config/prometheus.yaml" "--storage.tsdb.path=/data" "--storage.tsdb.retention.time=24h" "--web.enable-remote-write-receiver" "--enable-feature=exemplar-storage") "memory" "512Mi")
  (dict "name" "alertmanager" "port" 9093 "nodePort" 30094 "ready" "/-/ready" "args" (list "--config.file=/etc/config/alertmanager.yaml" "--storage.path=/data" "--cluster.listen-address=") "memory" "64Mi")
  (dict "name" "loki" "port" 3100 "nodePort" 30100 "ready" "/ready" "args" (list "-config.file=/etc/config/loki.yaml") "memory" "384Mi")
  (dict "name" "tempo" "port" 3200 "nodePort" 30200 "ready" "/ready" "args" (list "-config.file=/etc/config/tempo.yaml") "memory" "768Mi")
  (dict "name" "grafana" "port" 3000 "nodePort" 30300 "ready" "/api/health" "args" (list) "memory" "256Mi")
}}
{{- range $spec := $specs }}
{{- $config := $.Files.Get (printf "config/%s.yaml" $spec.name) }}
{{- if eq $spec.name "grafana" }}
{{- $config = printf "%s%s%s" ($.Files.Get "config/datasources.yaml") ($.Files.Get "config/dashboards.yaml") ($.Files.Get "config/payments.json") }}
{{- else if eq $spec.name "prometheus" }}
{{- $config = printf "%s%s" $config ($.Files.Get "config/alerts.yaml") }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $spec.name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $spec.name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $spec.name }}}
  template:
    metadata:
      labels: {app: {{ $spec.name }}}
      annotations:
        config-checksum: {{ $config | sha256sum | quote }}
        {{- if eq $spec.name "grafana" }}
        admin-configuration: {{ $.Values.grafanaPassword | sha256sum | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $spec.name }}
          image: {{ index $.Values.images $spec.name | required "backend image is required" }}
          args: {{ $spec.args | toJson }}
          {{- if eq $spec.name "grafana" }}
          env:
            - {name: GF_PATHS_DATA, value: /data}
            - {name: GF_PATHS_LOGS, value: /tmp}
            - {name: GF_PATHS_PLUGINS, value: /data/plugins}
            - {name: GF_PATHS_PROVISIONING, value: /etc/provisioning}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
          {{- end }}
          {{- if eq $spec.name "tempo" }}
          env:
            - {name: GOMEMLIMIT, value: 640MiB}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $spec.port }}}
            {{- if eq $spec.name "tempo" }}
            - {name: otlp, containerPort: 4318}
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ $spec.ready }}, port: http}
          startupProbe:
            httpGet: {path: {{ $spec.ready }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: http}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: {{ if eq $spec.name "tempo" }}256Mi{{ else }}64Mi{{ end }}}
            limits: {cpu: "1", memory: {{ $spec.memory }}}
          volumeMounts:
            - {name: config, mountPath: /etc/config, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $spec.name "grafana" }}
            - {name: config, mountPath: /etc/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: config, mountPath: /etc/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: telemetry-config}
        - name: data
          persistentVolumeClaim: {claimName: {{ $spec.name }}-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $spec.name }}
spec:
  type: NodePort
  selector: {app: {{ $spec.name }}}
  ports:
    - {name: http, port: {{ $spec.port }}, targetPort: http, nodePort: {{ $spec.nodePort }}}
    {{- if eq $spec.name "tempo" }}
    - {name: otlp, port: 4318, targetPort: otlp, nodePort: 30418}
    {{- end }}
---
{{- end }}
{{- end }}
