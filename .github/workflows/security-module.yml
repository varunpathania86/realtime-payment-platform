name: Scan module IaC

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --no-cache-dir -r scripts/requirements-catalog.txt
      - name: Install pinned scanner
        run: make tools TOOLS=trivy
      - name: Scan module IaC
        env:
          MODULE_NAME: ${{ inputs.module }}
        run: make security-module
      - name: Preserve report even on findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-module-${{ inputs.module }}
          path: |
            .local/security/module-${{ inputs.module }}.json
            .local/security/module-${{ inputs.module }}.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
