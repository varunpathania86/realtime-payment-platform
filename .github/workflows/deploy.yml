name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Git tag to deploy, e.g. v0.1.3
        required: true
      environment:
        description: Target environment
        type: choice
        options: [local, vps]
        default: local

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.environment == 'local' && fromJSON('["self-hosted","local"]') || fromJSON('["self-hosted","vps"]') }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      # Deployment steps are added when platform/ exists (Terraform + Helm) and a runner is registered.
      - name: Placeholder
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Deploy $VERSION - not implemented yet"
