name: Validate catalog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog validator dependencies
        run: python -m pip install --no-cache-dir -r scripts/requirements-catalog.txt
      - name: Validate catalog and release manifests
        run: python scripts/module_catalog.py validate
