schemaVersion: 1
kind: module-release

module: <module-name>
version: <immutable-module-version>
source:
  repository: <repository-url>
  commit: <full-git-commit>
  gitTag: <module-aware-git-tag>
workflow:
  runId: <workflow-run-id>
  url: <workflow-run-url>
artifacts:
  image:
    repository: <image-repository>
    tag: <version>
    digest: sha256:<image-digest>
  chart:
    repository: <chart-oci-repository>
    version: <version>
    digest: sha256:<chart-digest>
evidence:
  tests: []
  sbom: <sbom-reference>
  provenance: <provenance-reference>
  approvedImpact: patch
