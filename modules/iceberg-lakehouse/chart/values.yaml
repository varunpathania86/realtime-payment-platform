image:
  repository: rpp-local/iceberg-lakehouse
  tag: development
  digest: ""
  pullPolicy: Never
local:
  feature: lakehouse
realm: POLARIS
catalog: lakehouse
namespace: payments
warehouseLocation: s3://lakehouse/warehouse
# Keys: root-client-id, root-client-secret, token-secret and
# {writer,reader,maintainer}-client-{id,secret}; Terraform generates them per profile.
existingSecret: iceberg-lakehouse
database:
  url: jdbc:postgresql://payments-postgres.data.svc.cluster.local:5432/polaris
  # Keys username and password for the dedicated polaris role.
  existingSecret: polaris-database
storage:
  endpoint: http://minio.data.svc.cluster.local:9000
  region: us-east-1
  # Keys access-key and secret-key (shared local MinIO credential, see ADR-026).
  existingSecret: streaming-storage
javaMaxHeap: 256m
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {cpu: "1", memory: 640Mi}
