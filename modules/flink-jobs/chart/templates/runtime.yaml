{{/*
Renders the shared Flink ConfigMap, JobManager Service, and JobManager/TaskManager Deployments.
JobManager coordinates jobs; TaskManager executes operators. submit.yaml uses this Service
and ConfigMap to submit the Python job. streaming.enabled controls whether pods run.
Secrets and MinIO/Kafka services come from Terraform, not this template. See ../README.md.
*/}}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- if .Values.image.digest }}{{ $image = printf "%s@%s" .Values.image.repository .Values.image.digest }}{{ end }}
{{- define "flink-jobs.configuration" }}
{{- if not (has .Values.runtimeProfile (list "standard" "low-memory")) }}
{{- fail "runtimeProfile must be standard or low-memory" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  config.yaml: |
    jobmanager.rpc.address: {{ .Release.Name }}
    jobmanager.bind-host: 0.0.0.0
    blob.server.port: 6124
    jobmanager.memory.process.size: {{ if eq .Values.runtimeProfile "low-memory" }}{{ .Values.lowMemory.jobmanager.processMemory }}{{ else }}1024m{{ end }}
    taskmanager.memory.process.size: {{ if eq .Values.runtimeProfile "low-memory" }}{{ .Values.lowMemory.taskmanager.processMemory }}{{ else }}2048m{{ end }}
    taskmanager.numberOfTaskSlots: 1
    taskmanager.rpc.port: 6122
    taskmanager.data.port: 6121
    taskmanager.bind-host: 0.0.0.0
    parallelism.default: 1
    rest.address: {{ .Release.Name }}
    rest.bind-address: 0.0.0.0
    execution.checkpointing.interval: 10s
    execution.checkpointing.mode: EXACTLY_ONCE
    state.checkpoints.dir: {{ .Values.streaming.checkpointURI }}
    state.savepoints.dir: {{ .Values.streaming.savepointURI }}
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 20
    restart-strategy.fixed-delay.delay: 5s
    s3.endpoint: {{ .Values.streaming.endpoint }}
    s3.path.style.access: true
    s3.connection.ssl.enabled: false
{{- end }}
{{ include "flink-jobs.configuration" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}, component: jobmanager}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
    - {name: rpc, port: 6123, targetPort: 6123}
    - {name: blob, port: 6124, targetPort: 6124}
---
{{- range $role := list "jobmanager" "taskmanager" }}
{{/* "$" is the root chart context; the loop's "." is the current role string. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  replicas: {{ if $.Values.streaming.enabled }}1{{ else }}0{{ end }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $.Release.Name }}, component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $.Release.Name }}, component: {{ $role }}}
      annotations:
        config-checksum: {{ include "flink-jobs.configuration" $ | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Copies configuration to writable /runtime before the read-only main container starts.
        - name: configuration
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "/opt/job/runtime.py", "prepare"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: configuration, mountPath: /etc/job, readOnly: true}
      containers:
        - name: {{ $role }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $role | quote }}]
          env:
            - {name: FLINK_CONF_DIR, value: /runtime/conf}
            - {name: FLINK_LOG_DIR, value: /tmp/flink-logs}
            - {name: PYFLINK_CLIENT_EXECUTABLE, value: /opt/pyflink/bin/python}
            - {name: PYFLINK_PYTHON, value: /opt/pyflink/bin/python}
            - {name: CHECKPOINT_URI, value: {{ $.Values.streaming.checkpointURI | quote }}}
            - {name: KAFKA_BROKERS, value: {{ $.Values.events.brokers | quote }}}
            - {name: KAFKA_TLS, value: {{ $.Values.events.tls | quote }}}
            - {name: ANALYTICS_ENABLED, value: {{ $.Values.analytics.enabled | quote }}}
            {{- if $.Values.analytics.enabled }}
            - {name: CLICKHOUSE_URL, value: {{ $.Values.analytics.url | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ $.Values.analytics.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.analytics.existingSecret }}, key: password}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ $.Values.streaming.existingSecret }}, key: access-key, optional: true}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ $.Values.streaming.existingSecret }}, key: secret-key, optional: true}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.events.existingSecret }}, key: KAFKA_PASSWORD}
          ports:
            - {name: http, containerPort: 8081}
            - {name: rpc, containerPort: 6123}
            - {name: blob, containerPort: 6124}
          readinessProbe:
            {{- if eq $role "jobmanager" }}
            httpGet: {path: /overview, port: http}
            {{- else }}
            tcpSocket: {port: 6122}
            {{- end }}
          livenessProbe:
            {{- if eq $role "jobmanager" }}
            httpGet: {path: /overview, port: http}
            {{- else }}
            tcpSocket: {port: 6122}
            {{- end }}
            initialDelaySeconds: 60
          startupProbe:
            {{- if eq $role "jobmanager" }}
            httpGet: {path: /overview, port: http}
            {{- else }}
            tcpSocket: {port: 6122}
            {{- end }}
            failureThreshold: 60
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            {{- if eq $.Values.runtimeProfile "low-memory" }}
            {{- toYaml (index $.Values.lowMemory $role).resources | nindent 12 }}
            {{- else }}
            {{- toYaml (index $.Values $role).resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: tmp, mountPath: /tmp}
            {{- if $.Values.events.tls }}
            - {name: kafka, mountPath: /etc/kafka, readOnly: true}
            {{- end }}
      volumes:
        - {name: runtime, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: configuration
          configMap: {name: {{ $.Release.Name }}-config}
        {{- if $.Values.events.tls }}
        - name: kafka
          secret:
            secretName: {{ $.Values.events.existingSecret }}
            items: [{key: ca.pem, path: ca.pem}]
        {{- end }}
---
{{- end }}
