{{- if .Values.streaming.enabled }}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- if .Values.image.digest }}{{ $image = printf "%s@%s" .Values.image.repository .Values.image.digest }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-submit
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: configuration
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/opt/job/runtime.py", "prepare"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: configuration, mountPath: /etc/job, readOnly: true}
      containers:
        - name: submit
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/opt/job/runtime.py", "submit"]
          env:
            - {name: FLINK_CONF_DIR, value: /runtime/conf}
            - {name: FLINK_LOG_DIR, value: /tmp/flink-logs}
            - {name: S3_ENDPOINT, value: {{ .Values.streaming.endpoint | quote }}}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: CHECKPOINT_URI, value: {{ .Values.streaming.checkpointURI | quote }}}
            - {name: RESTORE_PATH, value: {{ .Values.streaming.restorePath | quote }}}
            - {name: KAFKA_BROKERS, value: {{ .Values.events.brokers | quote }}}
            - {name: KAFKA_REPLICATION_FACTOR, value: {{ .Values.events.replicationFactor | quote }}}
            - {name: KAFKA_TLS, value: {{ .Values.events.tls | quote }}}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.events.existingSecret }}, key: KAFKA_PASSWORD}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.streaming.existingSecret }}, key: access-key}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.streaming.existingSecret }}, key: secret-key}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.events.tls }}
            - {name: kafka, mountPath: /etc/kafka, readOnly: true}
            {{- end }}
      volumes:
        - {name: runtime, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: configuration
          configMap: {name: {{ .Release.Name }}-config}
        {{- if .Values.events.tls }}
        - name: kafka
          secret:
            secretName: {{ .Values.events.existingSecret }}
            items: [{key: ca.pem, path: ca.pem}]
        {{- end }}
{{- end }}
