{{/*
Declares the /api route for the separately installed Traefik ingress controller.
Traefik forwards to service.yaml; the prefix is preserved because the API accepts /api.
This resource does not start Traefik or expose a host port itself. See ../README.md.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          {{- if .Values.oidc.enabled }}
          # Only payment data needs browser session termination; health/version stay public for smoke.
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  name: http
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
