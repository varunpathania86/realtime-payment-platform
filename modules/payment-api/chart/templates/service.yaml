{{/*
Gives ingress.yaml and other in-cluster callers a stable address for the API pods.
The selector matches deployment.yaml (not the relay/consumer worker labels).
Service port 80 forwards to the pod's named "http" port, which is 8080. See ../README.md.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
