apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
      {{- if .Values.database.revision }}
        database-configuration: {{ .Values.database.revision | quote }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: "{{ include "payment-api.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          {{- include "payment-api.databaseMount" . | nindent 10 }}
          env:
            {{- include "payment-api.databaseEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: app
          {{- include "payment-api.databaseMount" . | nindent 10 }}
          image: "{{ include "payment-api.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "payment-api.databaseEnv" . | nindent 12 }}
            {{- include "payment-api.telemetryEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.database.tls }}
      volumes:
        {{- include "payment-api.databaseVolume" . | nindent 8 }}
      {{- end }}
