{{/*
Runs replicas of the Go static server that serves the built React portal.
service.yaml selects these pods; ingress.yaml routes browser requests to that Service.
The browser calls /api separately through the payment-api Ingress, not through this server.
With identity.enabled the same server signs in synthetic local users (Secret identity.existingSecret)
and, with bi.enabled, requests Superset guest tokens from the bi-dashboards Service using the
token-issuer password from that module's Secret; the browser loads the dashboard from bi.publicUrl.
With assistant.enabled it also signs short-lived identity assertions with the Ed25519 private key mounted
from assistant.signingSecret and forwards questions to the ai-orchestrator Service (ADR-030).
values.yaml supplies the image, replicas, resource budget, identity, BI and optional telemetry. See ../README.md.
*/}}
{{- if and .Values.oidc.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "OIDC requires one web-portal replica while opaque sessions are stored in process memory" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- if and .Values.identity.enabled .Values.assistant.enabled (not .Values.oidc.enabled) }}
        # Lets the non-root user read the 0440 signing key file.
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.telemetry.enabled .Values.identity.enabled }}
          env:
          {{- end }}
          {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_CLUSTER_NAME
              value: {{ .Values.telemetry.cluster | quote }}
          {{- end }}
          {{- if .Values.identity.enabled }}
          {{- if .Values.oidc.enabled }}
            # OIDC tokens stay in BFF memory; only the confidential client secret is mounted.
            - {name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: OIDC_INTERNAL_URL, value: {{ .Values.oidc.internalUrl | quote }}}
            - {name: OIDC_PORTAL_ORIGIN, value: {{ .Values.oidc.portalOrigin | quote }}}
            - {name: OIDC_LOCAL_HTTP, value: {{ .Values.oidc.localHTTP | quote }}}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.oidc.existingSecret }}, key: oidc-client-secret}
          {{- else }}
            - name: PORTAL_SESSION_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.existingSecret }}, key: session-key}
            - name: PORTAL_DEV_USERS
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.existingSecret }}, key: dev-users}
          {{- end }}
            - name: PORTAL_ALLOWED_ORIGINS
              {{- /* The Go server splits this value on spaces. */}}
              value: {{ join " " .Values.identity.allowedOrigins | quote }}
          {{- end }}
          {{- if and .Values.identity.enabled .Values.bi.enabled }}
            - name: BI_SUPERSET_URL
              value: {{ .Values.bi.supersetUrl | quote }}
            - name: BI_SUPERSET_PUBLIC_URL
              value: {{ .Values.bi.publicUrl | quote }}
            - name: BI_DASHBOARD_ID
              value: {{ .Values.bi.dashboardId | quote }}
            - name: BI_TOKEN_ISSUER_USER
              value: {{ .Values.bi.tokenIssuer | quote }}
            - name: BI_TOKEN_ISSUER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.bi.existingSecret }}, key: {{ .Values.bi.issuerPasswordKey }}}
          {{- end }}
          {{- if and .Values.identity.enabled .Values.assistant.enabled }}
            - name: AI_ORCHESTRATOR_URL
              value: {{ .Values.assistant.orchestratorUrl | quote }}
            {{- if not .Values.oidc.enabled }}
            - name: AI_ASSERTION_PRIVATE_KEY_FILE
              value: /assistant-identity/private-key.pem
          volumeMounts:
            - name: assistant-identity
              mountPath: /assistant-identity
              readOnly: true
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # Readiness controls Service traffic; liveness restarts an unhealthy server.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.identity.enabled .Values.assistant.enabled (not .Values.oidc.enabled) }}
      volumes:
        # Only the portal mounts the private key; orchestrator and tools mount the public key (ai-identity).
        - name: assistant-identity
          secret:
            secretName: {{ .Values.assistant.signingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.assistant.privateKeyKey }}
                path: private-key.pem
      {{- end }}
