misconfigurations:
  - id: KSV-0020
    paths: [chart/templates/deployment.yaml, chart/templates/setup-job.yaml]
    expired_at: 2027-01-01
    statement: >-
      Preserve the official Apache Polaris image's polaris UID 10000 (Trivy
      requires greater than 10000). The pod is non-root, read-only, and drops
      all capabilities. Revisit with a runtime-user change.
  - id: KSV-0110
    paths: [chart/templates/deployment.yaml, chart/templates/setup-job.yaml]
    expired_at: 2027-01-01
    statement: >-
      Terraform installs this reusable Helm release in the apps namespace.
      Raw chart scanning lacks the release namespace; keep templates reusable.
  - id: KSV-0125
    paths: [chart/templates/deployment.yaml, chart/templates/setup-job.yaml]
    expired_at: 2027-01-01
    statement: >-
      Local development intentionally loads rpp-local images with pull policy
      Never. Trusted publication supplies verified GHCR digests.
