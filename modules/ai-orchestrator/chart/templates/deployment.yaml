{{/*
The assistant API (FastAPI + LangGraph). The web-portal BFF calls it through service.yaml with two
signed assertions; it calls llm-serving for routing and answers and assistant-tools (MCP) for all
data. It holds no database credentials. Reads only the ai-identity public key Secret created by
local Terraform. Not exposed through ingress. See ../README.md.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "ai-orchestrator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: ASSERTION_PUBLIC_KEY_FILE, value: /identity/public-key.pem}
            - {name: LLM_CHAT_URL, value: {{ .Values.llm.chatUrl | quote }}}
            - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }}}
            - {name: ASSISTANT_TOOLS_URL, value: {{ .Values.assistantTools.url | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          secret:
            secretName: {{ .Values.assertionVerifier.existingSecret }}
            items: [{key: {{ .Values.assertionVerifier.publicKeyKey }}, path: public-key.pem}]
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
