{{/*
Cluster-internal Service for POST /v1/assistant/ask. Only the web-portal BFF calls it; the React
panel reaches it through the portal's ingress, so this chart has no Ingress. See ../README.md.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: {{ .Release.Name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ .Release.Name }}}
  ports:
    - {name: http, port: 8080, targetPort: http}
