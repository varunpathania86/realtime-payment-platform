{{/*
Stores files/schema.sql as a non-secret Kubernetes ConfigMap.
schema-job.yaml mounts it at /schema and applies the SQL; a ConfigMap does not execute SQL itself.
Credentials are kept in a separate Terraform-created Secret. See ../README.md.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-schema
data:
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
