image:
  repository: rpp-local/realtime-analytics
  tag: development
  digest: ""
  pullPolicy: Never
local:
  feature: analytics
database: analytics
user: rpp_analytics
existingSecret: realtime-analytics
# Optional SELECT-only user for dashboards; its password is another key in existingSecret.
biReader:
  enabled: false
  user: rpp_bi_reader
  passwordKey: bi-reader-password
# Optional SELECT-only user for the Stage 10 assistant-tools MCP server; same script, separate password.
aiReader:
  enabled: false
  user: rpp_ai_reader
  passwordKey: ai-reader-password
storage: 8Gi
resources:
  requests: {cpu: 500m, memory: 768Mi}
  limits: {cpu: "2", memory: 2048Mi}
