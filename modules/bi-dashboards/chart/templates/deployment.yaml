{{/*
Runs the Superset web server (gunicorn) that serves the embedded dashboard and its chart-data API.
Waits for nothing at start: setup-job.yaml (a pre-install/pre-upgrade hook) has already migrated and
provisioned the metadata database. Reads the bi-dashboards Secret; queries ClickHouse and, when
configured, Trino with credentials stored in the metadata database. Traffic arrives through
service.yaml (web-portal's guest-token endpoint) and ingress.yaml (the browser iframe). See ../README.md.
*/}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "bi-dashboards runs one replica without a shared cache; replicaCount must be 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The official image's superset user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: superset
          image: {{ include "bi-dashboards.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "bi-dashboards.configEnv" . | nindent 12 }}
            - {name: SERVER_WORKER_AMOUNT, value: {{ .Values.server.workers | quote }}}
            - {name: SERVER_THREADS_AMOUNT, value: {{ .Values.server.threads | quote }}}
            - {name: GUNICORN_TIMEOUT, value: {{ .Values.server.timeout | quote }}}
          ports:
            - {name: http, containerPort: 8088}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: home, mountPath: /app/superset_home}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: home, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
