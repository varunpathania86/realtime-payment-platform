{{/*
The platform MCP server (FastMCP streamable HTTP at /mcp). ai-orchestrator calls it through
service.yaml with the user's relayed identity assertion; every tool re-checks permissions.
Owns read-only credentials only: the knowledge reader role, the ClickHouse AI reader and the
payment-api read path, plus optional Trino. Reads the ai-identity, knowledge-database and
realtime-analytics Secrets created by local Terraform. Not exposed through ingress. See ../README.md.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: {{ include "assistant-tools.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.oidc.enabled }}
            # Keycloak signature and assistant-tools roles are checked before every tool call.
            - {name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: OIDC_INTERNAL_URL, value: {{ .Values.oidc.internalUrl | quote }}}
            {{- end }}
            {{- if not .Values.oidc.enabled }}
            - {name: ASSERTION_PUBLIC_KEY_FILE, value: /identity/public-key.pem}
            {{- end }}
            - {name: ALLOWED_HOSTS, value: {{ join "," .Values.allowedHosts | quote }}}
            - {name: LLM_EMBEDDINGS_URL, value: {{ .Values.embeddings.url | quote }}}
            - {name: PAYMENT_API_URL, value: {{ .Values.paymentApi.url | quote }}}
            - {name: CLICKHOUSE_URL, value: {{ .Values.clickhouse.url | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.existingSecret }}, key: {{ .Values.clickhouse.passwordKey }}}}
            - {name: TRINO_URL, value: {{ .Values.trino.url | quote }}}
            {{- with .Values.knowledgeDatabase }}
            # libpq reads PGPASSWORD, so the DSN itself never contains the secret.
            - name: KNOWLEDGE_DSN
              value: {{ printf "host=%s port=%v dbname=%s user=%s" .host .port .name .user | quote }}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ .existingSecret }}, key: {{ .passwordKey }}}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            {{- if not .Values.oidc.enabled }}
            - {name: identity, mountPath: /identity, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if not .Values.oidc.enabled }}
        - name: identity
          secret:
            secretName: {{ .Values.assertionVerifier.existingSecret }}
            items: [{key: {{ .Values.assertionVerifier.publicKeyKey }}, path: public-key.pem}]
        {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
