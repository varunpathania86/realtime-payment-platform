{{/*
Cluster-internal Service for the MCP endpoint at http://assistant-tools:8080/mcp. Only
ai-orchestrator calls it; there is deliberately no Ingress. See ../README.md.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: {{ .Release.Name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ .Release.Name }}}
  ports:
    - {name: http, port: 8080, targetPort: http}
